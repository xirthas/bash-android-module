name: Build Static Bash for Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # - arch: aarch64
          #   target: aarch64-linux-android
          #   host: aarch64-linux-android
          #   api: 21
          # - arch: arm
          #   target: armv7a-linux-androideabi
          #   host: arm-linux-androideabi
          #   api: 21
          - arch: x86_64
            target: x86_64-linux-android
            host: x86_64-linux-android
            api: 21
          # - arch: x86
          #   target: i686-linux-android
          #   host: i686-linux-android
          #   api: 21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Bash source
        run: |
          curl -O https://ftp.gnu.org/gnu/bash/bash-5.2.tar.gz
          tar -xzf bash-5.2.tar.gz
          mv bash-5.2 bash-src

      - name: Apply patches
        run: |
          cd bash-src
          shopt -s nullglob
          for p in ../patches/*.patch; do
            patch -p0 < "$p"
          done

      - name: Build Bash
        env:
          TARGET: ${{ matrix.target }}
          HOST: ${{ matrix.host }}
          API: ${{ matrix.api }}
        run: |
          cd bash-src
          
          TOOLCHAIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export AS=$CC
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          export CFLAGS="-static -O2 -Wno-error=implicit-function-declaration"
          export LDFLAGS="-static"

          sed -i 's/-rdynamic//g' configure
          sed -i '/strtoimax/d' Makefile.in
          sed -i -e 's/strtoimax.c strtoumax.c/strtoumax.c/' -e '/strtoimax/d' lib/sh/Makefile.in
          rm -f m4/strtoimax.m4 lib/sh/strtoimax.c

          ./configure \
            --host=${HOST} \
            --enable-static-link \
            --disable-nls \
            --without-bash-malloc \
            --enable-largefile \
            --enable-alias \
            --enable-readline \
            --enable-history \
            --enable-multibyte \
            --enable-job-control \
            --enable-array-variables \
            bash_cv_dev_fd=whacky \
            bash_cv_getcwd_malloc=yes \
            bash_cv_job_control_missing=present \
            bash_cv_sys_siglist=yes \
            bash_cv_func_sigsetjmp=present \
            bash_cv_unusable_rtsigs=no \
            ac_cv_func_getpwent=no \
            ac_cv_func_endpwent=no \
            ac_cv_func_setpwent=no \
            ac_cv_func_strchrnul=no \
            ac_cv_func_mbsnrtowcs=no

          sed -i 's/${LIBOBJDIR}mbschr$U.o ${LIBOBJDIR}strtoimax$U.o/${LIBOBJDIR}mbschr$U.o/' lib/sh/Makefile

          make -j$(nproc)
          make recho zecho printenv xcase
          $STRIP bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bash-${{ matrix.arch }}
          path: |
            bash-src/bash
            bash-src/recho
            bash-src/zecho
            bash-src/printenv
            bash-src/xcase

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Bash source for tests
        run: |
          curl -O https://ftp.gnu.org/gnu/bash/bash-5.2.tar.gz
          tar -xzf bash-5.2.tar.gz
          mv bash-5.2/tests ./tests

      - name: Download Artifact (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: bash-x86_64
          path: bash-bin

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          disable-linux-hw-accel: false 
          script: |
            set -e

            # Берём бинарник busybox из репозитория
            cp .github/bin/busybox-1.35.0-x86_64-linux-musl ./busybox

            # 1. Подготовка и получение Root-прав
            adb root
            adb wait-for-device
            adb shell setenforce 0

            # 2. АВТОПОВТОР СИСТЕМНОГО КОРНЯ В FAKE_ROOT
            # Создаем fake_root, если его нет
            adb shell mkdir -p /data/local/tmp/fake_root

            # Проходим по всем элементам реального корня Android и прокидываем ссылки/папки,
            # игнорируя те, которые мы заменим на ПК-структуру
            adb shell '
              for item in /.* /*; do
                name=$(basename "$item")
                # Пропускаем служебные точки, а также наши будущие ПК-папки
                if [ "$name" = "." ] || [ "$name" = ".." ] || \
                   [ "$name" = "bin" ] || [ "$name" = "sbin" ] || \
                   [ "$name" = "etc" ] || [ "$name" = "tmp" ] || \
                   [ "$name" = "var" ] || [ "$name" = "usr" ] || \
                   [ "$name" = "dev" ] || [ "$name" = "proc" ] || \
                   [ "$name" = "sys" ]; then
                  continue
                fi
                
                # Создаем символическую ссылку на оригинальный элемент Android внутри fake_root
                ln -sf "$item" "/data/local/tmp/fake_root/$name"
              done
            '

            # 3. Создаем НАШИ кастомные изолированные папки под структуру Linux-ПК
            adb shell mkdir -p /data/local/tmp/fake_root/usr/bin
            adb shell mkdir -p /data/local/tmp/fake_root/bin
            adb shell mkdir -p /data/local/tmp/fake_root/sbin
            adb shell mkdir -p /data/local/tmp/fake_root/etc
            adb shell mkdir -p /data/local/tmp/fake_root/tmp
            adb shell mkdir -p /data/local/tmp/fake_root/var
            
            # Системные папки ядра (их линковать нельзя, только монтировать)
            adb shell mkdir -p /data/local/tmp/fake_root/dev
            adb shell mkdir -p /data/local/tmp/fake_root/proc
            adb shell mkdir -p /data/local/tmp/fake_root/sys

            # 4. Выставляем права доступа
            adb shell chmod 755 /data/local/tmp/fake_root/usr
            adb shell chmod 755 /data/local/tmp/fake_root/usr/bin
            adb shell chmod 755 /data/local/tmp/fake_root/etc
            adb shell chmod 777 /data/local/tmp/fake_root/tmp
            adb shell chmod 755 /data/local/tmp/fake_root/var

            # 5. Монтируем виртуальные окружения Android внутрь нашего chroot
            adb shell mount -t devtmpfs udev /data/local/tmp/fake_root/dev || adb shell mount --bind /dev /data/local/tmp/fake_root/dev
            adb shell mount -t proc proc /data/local/tmp/fake_root/proc
            adb shell mount -t sysfs sysfs /data/local/tmp/fake_root/sys

            # 6. Создаем СИМВОЛИЧЕСКИЕ ссылки внутри изолированного ПК-корня (как на настоящем Linux)
            adb shell "cd /data/local/tmp/fake_root && rm -rf bin sbin && ln -s usr/bin bin && ln -s usr/bin sbin"

            # 7. Записываем passwd внутрь изолированного /etc (добавляем и root, и shell с UID 2000)
            adb shell "echo 'root:x:0:0:root:/root:/bin/sh' > /data/local/tmp/fake_root/etc/passwd"
            adb shell "echo 'shell:x:2000:2000:shell:/tmp:/bin/sh' >> /data/local/tmp/fake_root/etc/passwd"
            adb shell chmod 644 /data/local/tmp/fake_root/etc/passwd

            # 8. Загружаем BusyBox напрямую в изолированный /usr/bin/
            adb push busybox /data/local/tmp/fake_root/usr/bin/busybox
            adb shell chmod 755 /data/local/tmp/fake_root/usr/bin/busybox
            
            # Устанавливаем все стандартные утилиты Linux (ls, grep, awk) внутрь chroot
            adb shell "chroot /data/local/tmp/fake_root /usr/bin/busybox --install -s /usr/bin"

            # 9. Загружаем Bash и тестовые бинарники в изолированный /usr/bin/
            adb push bash-bin/bash /data/local/tmp/fake_root/usr/bin/
            adb push bash-bin/recho /data/local/tmp/fake_root/usr/bin/
            adb push bash-bin/zecho /data/local/tmp/fake_root/usr/bin/
            adb push bash-bin/printenv /data/local/tmp/fake_root/usr/bin/
            adb push bash-bin/xcase /data/local/tmp/fake_root/usr/bin/
            adb shell chmod 755 /data/local/tmp/fake_root/usr/bin/bash /data/local/tmp/fake_root/usr/bin/recho /data/local/tmp/fake_root/usr/bin/zecho /data/local/tmp/fake_root/usr/bin/printenv /data/local/tmp/fake_root/usr/bin/xcase

            # 10. Загружаем тесты и запускающий скрипт внутрь изолированной среды
            adb shell mkdir -p /data/local/tmp/fake_root/tests
            adb push tests /data/local/tmp/fake_root/
            adb shell chmod -R 777 /data/local/tmp/fake_root/tests

            # Сам запускаемый скрипт в корень изолированной среды
            adb push .github/run-tests-android.sh /data/local/tmp/fake_root/run-tests-android.sh
            adb shell chmod 755 /data/local/tmp/fake_root/run-tests-android.sh

            # 11. ЗАПУСК ТЕСТОВ
            adb shell "chroot /data/local/tmp/fake_root /usr/bin/sh /run-tests-android.sh"
