name: Build Static Bash for Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # - arch: aarch64
          #   target: aarch64-linux-android
          #   host: aarch64-linux-android
          #   api: 21
          # - arch: arm
          #   target: armv7a-linux-androideabi
          #   host: arm-linux-androideabi
          #   api: 21
          - arch: x86_64
            target: x86_64-linux-android
            host: x86_64-linux-android
            api: 21
          # - arch: x86
          #   target: i686-linux-android
          #   host: i686-linux-android
          #   api: 21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Bash source
        run: |
          curl -O https://ftp.gnu.org/gnu/bash/bash-5.2.tar.gz
          tar -xzf bash-5.2.tar.gz
          mv bash-5.2 bash-src

      - name: Apply patches
        run: |
          cd bash-src
          shopt -s nullglob
          for p in ../patches/*.patch; do
            patch -p0 < "$p"
          done

      - name: Build Bash
        env:
          TARGET: ${{ matrix.target }}
          HOST: ${{ matrix.host }}
          API: ${{ matrix.api }}
        run: |
          cd bash-src
          
          TOOLCHAIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export AS=$CC
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          export CFLAGS="-static -O2 -Wno-error=implicit-function-declaration"
          export LDFLAGS="-static"

          sed -i 's/-rdynamic//g' configure
          sed -i '/strtoimax/d' Makefile.in
          sed -i -e 's/strtoimax.c strtoumax.c/strtoumax.c/' -e '/strtoimax/d' lib/sh/Makefile.in
          rm -f m4/strtoimax.m4 lib/sh/strtoimax.c

          ./configure \
            --host=${HOST} \
            --enable-static-link \
            --disable-nls \
            --without-bash-malloc \
            --enable-largefile \
            --enable-alias \
            --enable-readline \
            --enable-history \
            --enable-multibyte \
            --enable-job-control \
            --enable-array-variables \
            bash_cv_dev_fd=whacky \
            bash_cv_getcwd_malloc=yes \
            bash_cv_job_control_missing=present \
            bash_cv_sys_siglist=yes \
            bash_cv_func_sigsetjmp=present \
            bash_cv_unusable_rtsigs=no \
            ac_cv_func_getpwent=no \
            ac_cv_func_endpwent=no \
            ac_cv_func_setpwent=no \
            ac_cv_func_strchrnul=no \
            ac_cv_func_mbsnrtowcs=no

          sed -i 's/${LIBOBJDIR}mbschr$U.o ${LIBOBJDIR}strtoimax$U.o/${LIBOBJDIR}mbschr$U.o/' lib/sh/Makefile

          make -j$(nproc)
          make recho zecho printenv xcase
          $STRIP bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bash-${{ matrix.arch }}
          path: |
            bash-src/bash
            bash-src/recho
            bash-src/zecho
            bash-src/printenv
            bash-src/xcase

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Bash source for tests
        run: |
          curl -O https://ftp.gnu.org/gnu/bash/bash-5.2.tar.gz
          tar -xzf bash-5.2.tar.gz
          mv bash-5.2/tests ./tests

      - name: Download Artifact (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: bash-x86_64
          path: bash-bin

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          disable-linux-hw-accel: false 
          script: |
            set -e

            # Берём бинарник busybox из репозитория
            cp .github/bin/busybox-1.35.0-x86_64-linux-musl ./busybox

            # 1. Подготовка и получение Root-прав
            adb root
            adb wait-for-device
            adb shell setenforce 0

            # 2. ОБХОД READ-ONLY: Монтируем tmpfs поверх корня /
            # Это сделает корень временно перезаписываемым в оперативной памяти устройства
            adb shell mount -t tmpfs tmpfs /
            
            # Восстанавливаем базовые системные папки Android в памяти, чтобы adb не отвалился
            adb shell mkdir -p /dev /proc /sys /data /system
            adb shell mount --move /dev /dev || true
            adb shell mount --move /proc /proc || true
            adb shell mount --move /sys /sys || true

            # 3. Создаем физические папки структуры ПК в fake_root
            adb shell mkdir -p /data/local/tmp/fake_root/usr/bin
            adb shell mkdir -p /data/local/tmp/fake_root/etc
            adb shell mkdir -p /data/local/tmp/fake_root/tmp
            adb shell mkdir -p /data/local/tmp/fake_root/var

            # 4. Выставляем разрешения (chmod)
            adb shell chmod 755 /data/local/tmp/fake_root/usr
            adb shell chmod 755 /data/local/tmp/fake_root/usr/bin
            adb shell chmod 755 /data/local/tmp/fake_root/etc
            adb shell chmod 777 /data/local/tmp/fake_root/tmp
            adb shell chmod 755 /data/local/tmp/fake_root/var

            # 5. Создаем символические ссылки в корне
            adb shell ln -s /data/local/tmp/fake_root/usr/bin /bin
            adb shell ln -s /data/local/tmp/fake_root/usr/bin /sbin
            adb shell ln -s /data/local/tmp/fake_root/etc /etc
            adb shell ln -s /data/local/tmp/fake_root/tmp /tmp
            adb shell ln -s /data/local/tmp/fake_root/usr /usr
            adb shell ln -s /data/local/tmp/fake_root/var /var

            # 6. Записываем passwd
            adb shell "echo 'root:x:0:0:root:/root:/bin/sh' > /etc/passwd"
            adb shell chmod 644 /etc/passwd

            # 7. Загружаем BusyBox напрямую в /bin (через fake_root)
            adb push busybox /data/local/tmp/fake_root/usr/bin/busybox
            adb shell chmod 755 /bin/busybox
            
            # Устанавливаем все стандартные Linux утилиты (ls, cd, awk, sed, grep и т.д.) в /bin
            adb shell '/bin/busybox --install -s /bin'

            # 8. Загружаем Bash и тестовые бинарники в /bin
            adb push bash-bin/bash /data/local/tmp/fake_root/usr/bin/
            adb push bash-bin/recho /data/local/tmp/fake_root/usr/bin/
            adb push bash-bin/zecho /data/local/tmp/fake_root/usr/bin/
            adb push bash-bin/printenv /data/local/tmp/fake_root/usr/bin/
            adb push bash-bin/xcase /data/local/tmp/fake_root/usr/bin/
            
            # Делаем исполняемыми
            adb shell chmod 755 /bin/bash /bin/recho /bin/zecho /bin/printenv /bin/xcase

            # 9. Загружаем тесты и запускающий скрипт
            adb push tests /data/local/tmp/
            adb push .github/run-tests-android.sh /data/local/tmp/
            adb shell chmod 755 /data/local/tmp/run-tests-android.sh

            # 10. unroot для запуска тестов
            adb unroot
            adb wait-for-device

            adb shell ls -la /

            adb shell "/data/local/tmp/run-tests-android.sh" < /dev/null